[project]
name = "agent-brain"
version = "0.2.0"
description = "Shared, per-project long-term memory for coding agents: an Obsidian vault indexed with graphify."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Pinned so every machine builds the graph the same way; bump deliberately.
dependencies = ["graphifyy==0.9.73"]

[project.urls]
Homepage = "https://github.com/luigel/agent-brain"

[project.scripts]
brain = "agent_brain.core:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_brain"]
